name: flap
description: >-
  OpenAPI → Dart/Flutter client generator for 3.0, 3.1 and Swagger 2.0.
  Generates Freezed + json_serializable clients, no Java required.
version: 0.0.2
repository: https://github.com/miracle101000/flap-dart
issue_tracker: https://github.com/miracle101000/flap-dart/issues
documentation: https://github.com/miracle101000/flap-dart#readme

topics:
  - code-generation
  - openapi
  - flutter
  - dart
  - rest-api

screenshots:
  - description: Comparison of generated code from flap vs openapi-generator
    path: doc/screenshot_generate.png

environment:
  sdk: ">=3.0.0 <4.0.0"

# Activated via: dart pub global activate flap
# Usage:         flap --out ./sdks path/to/spec.yaml
executables:
  flap: flap

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  http: ^1.6.0
  path: ^1.9.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
