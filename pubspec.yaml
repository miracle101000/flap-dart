name: flap
description: >-
  Fast, zero-dependency OpenAPI → Dart/Flutter client generator. Lowers
  OpenAPI 3.0, 3.1, and Swagger 2.0 specs into idiomatic Dart/Flutter
  clients using Freezed + json_serializable — no Java required.
version: 0.0.2
repository: https://github.com/miracle101000/flap-dart
issue_tracker: https://github.com/miracle101000/flap-dart/issues
documentation: https://github.com/miracle101000/flap-dart#readme

topics:
  - code-generation
  - openapi
  - flutter
  - dart
  - rest-api

screenshots:
  - description: Comparison of generated code from flap vs openapi-generator
    path: doc/screenshot_generate.png

environment:
  sdk: ">=3.0.0 <4.0.0"

# Activated via: dart pub global activate flap
# Usage:         flap --out ./sdks path/to/spec.yaml
executables:
  flap: flap

dependencies:
  archive: ^3.6.0
  crypto: ^3.0.3
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.0
